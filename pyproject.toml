[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "win2sds"
version = "0.1.0"
description = "Convert WIN-format seismic data files to miniseed in SDS directory structure"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "obspy>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
win2sds = "win2sds:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["win2sds*"]
